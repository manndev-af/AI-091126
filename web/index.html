<!-- Tugas anggota 4: halaman chat berbahasa Indonesia; kontrak di README.md. -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Akademik Informatika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">IF</div>
        <div>
          <h1>Asisten Akademik</h1>
          <p class="status"><span class="dot"></span>Prodi Informatika · Angkatan 2025</p>
        </div>
      </div>
      <button id="btn-reset" class="btn-ghost" title="Mulai percakapan baru">Reset</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <h2>Halo! Ada yang bisa dibantu?</h2>
        <p>Tanyakan seputar jadwal kuliah, dosen, KRS, atau info akademik lainnya.</p>
        <div class="chips">
          <button class="chip" type="button">Apa itu UNP?</button>
          <button class="chip" type="button">Siapa dosen AI?</button>
          <button class="chip" type="button">Jadwal kuliah AI kapan?</button>
          <button class="chip" type="button">Apa tujuan mempelajari AI?</button>
        </div>
      </section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="2000" aria-label="Pertanyaan" placeholder="Ketik pertanyaanmu..." required></textarea>
      <button id="btn-send" type="submit" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="footnote">Jawaban dari <b>Knowledge Base</b> sudah diverifikasi. Pertanyaan dicocokkan dengan data knowledge base.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
